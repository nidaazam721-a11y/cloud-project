<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirTrack PK | Airport Operating System</title>
    <!-- FontAwesome Icons & Chart.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: radial-gradient(circle at 50% 10%, #0a1128 0%, #030712 60%, #010204 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }
        .container {
            background: rgba(8, 14, 28, 0.95);
            backdrop-filter: blur(25px);
            width: 100%;
            max-width: 1350px;
            border-radius: 24px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.95), 0 0 50px rgba(56, 189, 248, 0.25);
            overflow: hidden;
            border: 1px solid rgba(56, 189, 248, 0.4);
            animation: fadeIn 0.8s ease-in-out;
            position: relative;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Aesthetic Airport Terminal & Aeroplane Banner */
        .header {
            background: linear-gradient(135deg, rgba(3, 105, 161, 0.88), rgba(29, 78, 216, 0.88), rgba(4, 120, 87, 0.88)), 
                        url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1400&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 55px 25px;
            text-align: center;
            position: relative;
            box-shadow: inset 0 -25px 45px rgba(0, 0, 0, 0.7);
            border-bottom: 2px solid rgba(56, 189, 248, 0.5);
        }
        .header h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 0.8px;
            text-shadow: 0 3px 12px rgba(0,0,0,0.9);
        }
        .header p {
            font-size: 13px;
            opacity: 0.95;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(16, 185, 129, 0.35);
            border: 1px solid #34d399;
            color: #34d399;
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 18px;
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.5);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .status-badge:hover { transform: scale(1.03); }
        .dot {
            height: 8px;
            width: 8px;
            background-color: #34d399;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Navigation Bar HUD Style */
        .nav-tabs {
            display: flex;
            background: rgba(2, 6, 23, 0.95);
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
            overflow-x: auto;
        }
        .tab-btn {
            padding: 14px 18px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }
        .tab-btn:hover, .tab-btn.active {
            color: #38bdf8;
            border-bottom-color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        .content { padding: 30px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section-title {
            font-size: 13px;
            color: #38bdf8;
            border-bottom: 2px solid rgba(56, 189, 248, 0.35);
            padding-bottom: 8px;
            margin-bottom: 20px;
            margin-top: 25px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .section-title:first-child { margin-top: 0; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }
        .clickable-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(56, 189, 248, 0.04));
            backdrop-filter: blur(12px);
            padding: 18px 22px;
            border-radius: 14px;
            border-left: 4px solid #38bdf8;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        .clickable-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.08);
            border-left-color: #34d399;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
        }
        .clickable-card label {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .clickable-card span {
            font-size: 14px;
            color: #f8fafc;
            font-weight: 600;
        }

        .weather-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(30, 41, 59, 0.65));
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 14px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .weather-card:hover {
            transform: translateY(-3px);
            border-color: #34d399;
            box-shadow: 0 8px 25px rgba(52, 211, 153, 0.25);
        }

        .quick-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }
        .quick-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }

        .img-card {
            background: rgba(15, 23, 42, 0.92);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(56, 189, 248, 0.3);
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }
        .img-card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
            box-shadow: 0 12px 35px rgba(56, 189, 248, 0.35);
        }
        .img-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .img-card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .img-card-title { font-size: 15px; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
        .img-card-sub { font-size: 11px; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; }

        .airport-tag-bar {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .tag-pill {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }
        .action-btn-sm {
            flex: 1;
            padding: 7px 10px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .action-btn-sm:hover {
            background: #38bdf8;
            color: #030712;
        }

        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-input {
            flex: 1;
            min-width: 200px;
            background: #030712;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 9px 14px;
            border-radius: 10px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }
        .filter-btn {
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #94a3b8;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            transition: all 0.3s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #38bdf8;
            color: #030712;
            border-color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header with AirTrack PK Branding -->
        <div class="header">
            <h1>AirTrack <span style="font-size:20px; font-weight:400; color:#38bdf8; opacity:0.9;">PK</span></h1>
            <p><i class="fa-solid fa-plane-departure"></i> Next-Gen Airspace Telemetry & Command Center</p>
            <div class="status-badge" onclick="showInfoModal('Aviation Network Status', '9 Major International Nodes Online', 'Islamabad, Lahore, Karachi, Sialkot, Peshawar, Quetta, Multan, Faisalabad, Gwadar connected via Vercel Edge Cloud System.')">
                <span class="dot"></span> All Major Pakistan Airports Live & Connected
            </div>
        </div>

        <!-- Navigation Bar -->
        <div class="nav-tabs" id="mainNavTabs">
            <button class="tab-btn active" onclick="switchTab('overview', this)"><i class="fa-solid fa-gauge"></i> Overview</button>
            <button class="tab-btn" onclick="switchTab('airports', this)"><i class="fa-solid fa-building-ngo"></i> Airports Hub</button>
            <button class="tab-btn" onclick="switchTab('booking', this)"><i class="fa-solid fa-ticket"></i> Book Flight</button>
            <button class="tab-btn" style="color:#fbbf24;" onclick="switchTab('missed', this)"><i class="fa-solid fa-plane-slash"></i> Missed Desk</button>
            <button class="tab-btn" onclick="switchTab('schedules', this)"><i class="fa-solid fa-calendar-days"></i> Schedules</button>
            <button class="tab-btn" onclick="switchTab('manifest', this)"><i class="fa-solid fa-users"></i> Passengers DB</button>
            <button class="tab-btn" onclick="switchTab('radar', this)"><i class="fa-solid fa-plane-departure"></i> ATC Radar</button>
            <button class="tab-btn" onclick="switchTab('refuel', this)"><i class="fa-solid fa-gas-pump"></i> Fuel & Ground</button>
            <button class="tab-btn" onclick="switchTab('emergency', this)"><i class="fa-solid fa-triangle-exclamation"></i> CFR Emergency</button>
            <button class="tab-btn" onclick="switchTab('retail', this)"><i class="fa-solid fa-shop"></i> Duty-Free POS</button>
        </div>

        <!-- MAIN DASHBOARD CONTENT -->
        <div class="content" id="dashboardContent">
            <!-- TAB 1: OVERVIEW -->
            <div id="overview" class="tab-content active">
                <div class="section-title"><i class="fa-solid fa-terminal"></i> System Command Metadata</div>
                <div class="grid">
                    <div class="clickable-card" onclick="showInfoModal('System Administrator Details', 'Ome Robab', 'Software Engineer & System Architect responsible for designing Pakistan Civil Aviation AOMS cloud console architecture.')">
                        <label><i class="fa-solid fa-user-shield"></i> System Administrator</label>
                        <span>Ome Robab</span>
                    </div>
                    <div class="clickable-card" onclick="showInfoModal('Console Architecture', 'Enterprise Cloud & AOMS', 'Built with single-page Client Rendering Engine, Chart.js POS analytics, HTML5 Radar Canvas, and real-time PNR Generation algorithm.')">
                        <label><i class="fa-solid fa-network-wired"></i> Console Architecture</label>
                        <span>Enterprise Cloud & AOMS</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
