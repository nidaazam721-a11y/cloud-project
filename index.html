<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Cloud Architecture Dashboard - Ome Robab</title>
    <!-- FontAwesome & Chart.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: radial-gradient(circle at 50% 10%, #0f172a 0%, #070913 60%, #020408 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }
        .container {
            background: rgba(11, 17, 32, 0.95);
            backdrop-filter: blur(25px);
            width: 100%;
            max-width: 1200px;
            border-radius: 24px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9), 0 0 40px rgba(56, 189, 248, 0.15);
            overflow: hidden;
            border: 1px solid rgba(56, 189, 248, 0.3);
            animation: fadeIn 0.8s ease-in-out;
            position: relative;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            background: linear-gradient(135deg, #0284c7, #2563eb, #7c3aed);
            color: white;
            padding: 35px 25px;
            text-align: center;
            position: relative;
            box-shadow: inset 0 -10px 25px rgba(0, 0, 0, 0.3);
        }
        .header h1 {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
        }
        .header p {
            font-size: 14px;
            opacity: 0.95;
            font-weight: 500;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(16, 185, 129, 0.25);
            border: 1px solid #34d399;
            color: #34d399;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 15px;
            box-shadow: 0 0 18px rgba(52, 211, 153, 0.4);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .status-badge:hover {
            transform: scale(1.03);
        }
        .dot {
            height: 8px;
            width: 8px;
            background-color: #34d399;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            background: rgba(3, 7, 18, 0.8);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            overflow-x: auto;
        }
        .tab-btn {
            padding: 14px 22px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
